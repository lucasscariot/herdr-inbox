# herdr-plugin.toml registers Herdr Inbox with Herdr.
#
# Install with `herdr plugin install lucasscariot/herdr-inbox`, or for a
# checkout `herdr plugin link /path/to/herdr-inbox`. There is no build step:
# every entrypoint is standard-library Python 3.9+, and the discovery probe and
# event relay run on saved machines from source over SSH.
#
# Bind the two actions to keys in ~/.config/herdr/config.toml (see README).

id = "lucasscariot.herdr-inbox"
name = "Herdr Inbox"
version = "0.5.0"
min_herdr_version = "0.9.1"
description = "Start agent threads on any project, harness, machine, or worktree. Keep every agent in one live inbox."
platforms = ["linux", "macos"]

# Actions open (or refocus) the composer and the inbox as plugin tab panes.
[[actions]]
id = "new"
title = "New agent thread"
contexts = ["global", "workspace", "pane"]
command = ["python3", "main.py", "open", "--view", "new"]

[[actions]]
id = "open"
title = "Agent inbox"
contexts = ["global", "workspace", "pane"]
command = ["python3", "main.py", "open", "--view", "inbox"]

# Dictate into the focused agent pane from any Herdr client: bind a key to this
# action (for example ctrl+t) and it opens a small popup that records, then
# Enter sends the transcript to that agent and Ctrl+T types it for editing.
[[actions]]
id = "dictate"
title = "Dictate to this agent"
contexts = ["pane", "global"]
command = ["python3", "main.py", "dictate", "--open"]

# Panes are what the actions open; `herdr plugin pane open --plugin lucasscariot.herdr-inbox --entrypoint launcher` works too.
[[panes]]
id = "launcher"
title = "New thread"
placement = "tab"
command = ["python3", "main.py", "ui", "--view", "new"]

[[panes]]
id = "inbox"
title = "Agent inbox"
placement = "tab"
command = ["python3", "main.py", "ui", "--view", "inbox"]

[[panes]]
id = "dictation"
title = "Dictate"
placement = "popup"
width = 64
height = 7
command = ["python3", "main.py", "dictate", "--popup"]
