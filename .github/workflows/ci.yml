name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The Herdr release the end-to-end tests run against.
  HERDR_VERSION: v0.9.3

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  e2e:
    name: End to end · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: herdr-linux-x86_64
          - os: macos-latest
            asset: herdr-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Herdr ${{ env.HERDR_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/herdr"
          gh release download "$HERDR_VERSION" -R herdrdev/herdr -p '${{ matrix.asset }}' -O "$RUNNER_TEMP/herdr/herdr"
          chmod +x "$RUNNER_TEMP/herdr/herdr"
          "$RUNNER_TEMP/herdr/herdr" --version
      - name: Test against a real Herdr
        run: HERDR_E2E=1 HERDR_BIN="$RUNNER_TEMP/herdr/herdr" cargo test --locked --test e2e -- --nocapture

  legacy:
    name: Legacy plugin · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q inbox main.py tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Validate herdr-plugin.toml
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          python - <<'EOF'
          import tomllib
          manifest = tomllib.load(open("herdr-plugin.toml", "rb"))
          for key in ("id", "name", "version", "min_herdr_version", "description", "platforms"):
              assert manifest.get(key), key + " is missing"
          ids = [entry["id"] for entry in manifest.get("actions", []) + manifest.get("panes", [])]
          assert len(ids) == len(set(ids)), "duplicate entrypoint ids"
          for entry in manifest.get("actions", []) + manifest.get("panes", []):
              assert entry["command"][:2] == ["python3", "main.py"], entry
          print("manifest ok:", manifest["id"], manifest["version"])
          EOF
