name: Release

# A `v*` tag builds every binary and publishes them as a GitHub release, with
# checksums the installer verifies. Pull requests that touch the release path
# build the same binaries without publishing, so a broken release is caught
# before the tag.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build · ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="herdr-inbox-${{ matrix.asset }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/herdr-inbox" dist/
          cp LICENSE README.md dist/
          tar -czf "$name.tar.gz" -C dist herdr-inbox LICENSE README.md
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          cat "$name.tar.gz.sha256"
      - name: Check the binary runs here
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./dist/herdr-inbox --version
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-inbox-${{ matrix.asset }}
          path: |
            herdr-inbox-${{ matrix.asset }}.tar.gz
            herdr-inbox-${{ matrix.asset }}.tar.gz.sha256

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the tag matches the crate version
        run: |
          crate="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          [ "$crate" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $crate"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "Herdr Inbox ${GITHUB_REF_NAME#v}"
