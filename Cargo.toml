[package]
name = "herdr-inbox"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
description = "One keyboard-first inbox for every coding agent on every machine, on top of Herdr."
license = "MIT"
repository = "https://github.com/lucasscariot/herdr-inbox"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0"
tempfile = "3"
thiserror = "2.0.21"
toml = "0.8"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
insta = "1.49.0"
portable-pty = "0.9"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
